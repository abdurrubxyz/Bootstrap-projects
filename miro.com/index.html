<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <nav class="p-3 py-4">
        <div class="container-fluid">
          <div
            class="nav-wrapper d-flex flex-column gap-5 flex-xl-row align-items-center justify-content-center justify-content-xl-between"
          >
            <div
              class="d-flex flex-column align-items-center gap-4 flex-lg-row"
            >
              <div>
                <a href="">
                  <img
                    src="./assets/images/miro-logo.png"
                    alt=""
                    class="d-block"
                  />
                </a>
              </div>
              <div class="d-flex flex-column gap-4 flex-md-row gap-md-5">
                <a href="">Product <i class="bi bi-chevron-down"></i></a>
                <a href="">Solutions <i class="bi bi-chevron-down"></i></a>
                <a href="">Resources <i class="bi bi-chevron-down"></i></a>
                <a href="">Enterprise</a>
                <a href="">Pricing</a>
              </div>
            </div>
            <div
              class="d-flex flex-column flex-md-row align-items-md-center justify-content-center gap-4"
            >
              <a href="" class="d-flex align-items-center gap-1">
                <img src="./assets/images/navbar/world.png" alt="" />
                <span>EN</span>
              </a>
              <a href="">Contact Sales</a>
              <a href="">Login</a>
              <a href="" class=""
                >Sign up free <i class="bi bi-arrow-right"></i
              ></a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="container container-main">
          <div class="hero-wrapper">
            <div class="row align-items-center">
              <div class="col">
                <div>
                  <h1 class="fw-bold mb-3">
                    <span class="d-block">Take ideas from </span>
                    <span class="d-block">better to best</span>
                  </h1>
                  <p class="mb-4">
                    <span class="d-block"
                      >Miro is your team's visual platform to connect,</span
                    >
                    <span class="d-block"
                      >collaborate, and create - together</span
                    >
                  </p>
                  <form action="">
                    <input type="text" placeholder="Enter your work email"  class="d-block mb-2"/>
                    <button class="d-block text-center">
                      Sign up free <i class="bi bi-arrow-right"></i>
                    </button>
                  </form>
                  <p>collaborate with your team within a minutes</p>
                  <div class="reviews">
                    <div class="">
                      <div>
                        <img src="./assets/images/hero/star.png" alt="">
                        <img src="./assets/images/hero/star.png" alt="">
                        <img src="./assets/images/hero/star.png" alt="">
                        <img src="./assets/images/hero/star.png" alt="">
                        <img src="./assets/images/hero/star.png" alt="">
                      </div>
                      <p>Based on 5149+ reviews:</p>
                    </div>
                    <div class="">
                      <img src="./assets/images/hero/img1.png" alt="">
                      <img src="./assets/images/hero/img2.png" alt="">
                      <img src="./assets/images/hero/img3.png" alt="">
                    </div>
                  </div>
                </div>
              </div>
              <div class="col">
                <img src="./assets/images/hero/hero-banner.png" alt="">
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
